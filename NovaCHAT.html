<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- 全螢幕 + 鎖定縮放（照 Group.html）：畫到整個螢幕、禁止雙指/雙擊放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 狀態列透明、畫面延伸到狀態列/瀏海底下（照 Group 做法）；內容用 env(safe-area-inset-*) 讓開 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaCHAT">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>NovaCHAT</title>
  <style>
    :root {
      --nc-blue: #007aff;
      --nc-fill-secondary: rgba(120,120,128,0.16);
      --nc-label-secondary: #727272;
      --nc-bar-fill: rgba(249,249,249,0.94);
      --nc-bar-active: rgba(120,120,128,0.14);
      --nc-text: #000;
      --nc-text-2: #8a8a8e;
      --nc-sep: rgba(60,60,67,0.12);
      --nc-chip: rgba(120,120,128,0.12);
      --nc-badge: #ff3b30;
      --nc-online: #34c759;
      --nc-bubble-me: #95ec69;   /* 訊息氣泡：LINE / 微信 那種綠 */
      --nc-bubble-them: #ffffff;   /* 別人傳來的訊息：純白 */
      --sf: -apple-system, "SF Pro Text", "SF Pro", system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --inter: "Inter", -apple-system, system-ui, "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    /* 鎖定：全螢幕、不捲動頁面、不放大、不橡皮筋、不選取/長按選單 */
    html { height: 100%; overflow: hidden; }
    /* 照 Group：body 不用 position:fixed（那會在 iOS 底部安全區留出一塊）；正常流 + 禁止橡皮筋 */
    body {
      min-height: 100%; width: 100%; overflow: hidden;
      background: #fff; font-family: var(--sf); display: flex; justify-content: center;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }

    .app {
      /* 照 Group：用 100vh（iOS 固定為工具列收起時的最大高度，不像 dvh 會動），
         畫面永遠 ≥ 可見範圍 → 底部不會「有時多一塊」；底欄是 fixed 永遠貼可見底部 */
      position: relative; width: 100%; height: 100vh;
      background: #fff; overflow: hidden; display: flex; flex-direction: column;
    }

    /* 頂部 */
    /* 搜尋欄貼頂：上方只留安全區（瀏海／動態島），無額外空隙 */
    .topbar { flex: 0 0 auto; padding: env(safe-area-inset-top, 0px) 16px 0; }
    .search { width: 100%; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 11px; background: var(--nc-fill-secondary); border-radius: 100px; }
    .search .mag { width: 21px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mag svg { width: 17px; height: 17px; }
    .search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--sf); font-size: 17px; line-height: 22px; letter-spacing: -0.08px; color: #000; }
    .search input::placeholder { color: var(--nc-label-secondary); opacity: 1; }
    .search .mic { width: 17px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mic svg { width: 12px; height: 18px; }
    .chat-label { margin: 16px 0 0 2px; font-family: var(--inter); font-weight: 400; font-size: 12px; color: #000; white-space: nowrap; }
    .chips { display: flex; gap: 8px; margin-top: 12px; }
    .chip { border: 0; cursor: pointer; font-family: var(--sf); font-size: 14px; font-weight: 600; background: var(--nc-chip); color: #3c3c43; padding: 7px 15px; border-radius: 100px; display: inline-flex; align-items: center; gap: 6px; }
    .chip.active { background: #000; color: #fff; }
    .chip .cnt { background: var(--nc-badge); color: #fff; font-size: 11px; font-weight: 700; border-radius: 100px; padding: 0 6px; min-width: 18px; text-align: center; }
    .chip.active .cnt { background: rgba(255,255,255,.3); }

    /* 列表 */
    .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 6px 0 96px; }
    .list::-webkit-scrollbar { width: 0; }
    .crow { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; position: relative; }
    .crow:active { background: rgba(0,0,0,0.04); }
    .crow + .crow::before { content: ""; position: absolute; left: 80px; right: 0; top: 0; height: 1px; background: var(--nc-sep); }
    .av { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 19px; position: relative; }
    .av .dot { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--nc-online); border: 2.5px solid #fff; }
    .av .gb { position: absolute; right: -2px; bottom: -2px; width: 19px; height: 19px; border-radius: 50%; background: #eee; color: #8a8a8e; display: grid; place-items: center; border: 2px solid #fff; }
    .av .gb svg { width: 11px; height: 11px; }
    .cmain { flex: 1; min-width: 0; }
    .ctop { display: flex; align-items: baseline; gap: 8px; }
    .cname { font-size: 16px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctime { margin-left: auto; font-size: 13px; color: var(--nc-text-2); flex: 0 0 auto; }
    .crow.unread .ctime { color: var(--nc-blue); }
    .cbot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .cprev { font-size: 14px; color: var(--nc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; line-height: 1.3; }
    .crow.unread .cprev { color: #000; }
    .cprev .by { color: var(--nc-text-2); }
    .ticks { color: var(--nc-text-2); flex: 0 0 auto; display: inline-flex; }
    .ticks.read { color: var(--nc-blue); }
    .ticks svg { width: 16px; height: 16px; }
    .cbadge { flex: 0 0 auto; background: var(--nc-badge); color: #fff; font-size: 12px; font-weight: 700; border-radius: 100px; min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; }
    .cmute { color: var(--nc-text-2); flex: 0 0 auto; display: inline-flex; }
    .cmute svg { width: 16px; height: 16px; }
    .empty { display: none; text-align: center; color: var(--nc-text-2); padding: 64px 32px; }
    .empty svg { width: 46px; height: 46px; opacity: .4; margin-bottom: 12px; }
    .empty h3 { font-size: 16px; color: #3c3c43; margin-bottom: 4px; font-weight: 600; }
    .empty p { font-size: 14px; }

    /* Tab Bar — iOS 底部不過高：用 max() 不疊加 safe-area */
    /* 照 Group：固定高度、離底固定距離，不吃 safe-area → 不會變高 */
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; padding: 0 16px 20px; }
    /* 玻璃底欄（iOS fallback 毛玻璃 + bezel 亮邊；顏色不變：同一白 249,249,249，只降不透明度） */
    .tabbar-inner { width: 100%; height: 62px; position: relative; touch-action: none;
      background: rgba(249,249,249,0.55);
      backdrop-filter: blur(20px) saturate(190%); -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 0; border-radius: 999px;
      box-shadow: inset 0 1px 0.5px rgba(255,255,255,0.75), inset 0 0 0 0.5px rgba(255,255,255,0.4), inset 0 -1.5px 2px rgba(255,255,255,0.25), 0 8px 15px rgba(0,0,0,0.12); }
    /* 分頁層：鏡片滑過時用 clip-path 在這一層挖洞（底欄玻璃保持完整，不會透出背景） */
    .tab-row { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 4px; }
    /* 靜止時的灰色膠囊（照 Group：transform 移動 + 彈性曲線） */
    .tab-pill { position: absolute; top: 5px; left: 0; height: 52px; width: 0; background: var(--nc-bar-active); border-radius: 999px; z-index: 0; pointer-events: none; transform: translateX(0); transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .28s ease; }
    .tabbar-inner.is-dragging .tab-pill { opacity: 0; }
    /* 拖動時：真實 tab 一律不藍（含原本選中的），藍色只由玻璃鏡片呈現；放手後鏡片淡出、目標 tab 才淡入藍色 */
    .tabbar-inner.is-dragging .tab { color: #000; }
    /* 滑動時的真・液態玻璃鏡片（移植 Group：createGlass content 模式折射 canvas 複本；iOS 也能折射） */
    .tab-lens { position: fixed; left: 0; top: 0; width: var(--lens-w, 84px); height: 72px; border-radius: 36px; z-index: 7; pointer-events: none; opacity: 0; scale: .7; visibility: hidden; transform-origin: center; transition: opacity .18s ease, scale .24s cubic-bezier(.4,0,.2,1), visibility 0s linear .24s; will-change: translate, scale, opacity; }
    .tab-lens__glass { position: absolute; inset: 0; border-radius: inherit; background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7), inset 0 2px 2px rgba(255,255,255,0.75), inset 0 -2px 2px rgba(255,255,255,0.35); }
    .tab-lens.is-on { opacity: 1; scale: 1; visibility: visible; transition: opacity .16s ease, scale .45s cubic-bezier(.34,1.56,.64,1), visibility 0s; }
    .tab-lens__canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    .tab { flex: 1; z-index: 1; height: 52px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; color: #000; font-family: var(--sf); position: relative; transition: color .2s ease; }
    .tab .ico { width: 26px; height: 26px; display: grid; place-items: center; }
    .tab .ico svg { width: 24px; height: 24px; fill: currentColor; }
    .tab .lbl { font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; }
    .tab.active { color: var(--nc-blue); }

    /* 對話頁 */
    /* 背景套在固定大小的對話容器上（不是會捲動的 .msgs），避免照片被放大 */
    .convo { position: absolute; inset: 0; z-index: 20; background: #fff; background-size: cover; background-position: center; background-repeat: no-repeat; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); visibility: hidden; }
    .convo.open { transform: translateX(0); visibility: visible; }
    /* 頂部透明：照片透到最上（無白底、無分隔線）*/
    .convo-header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 10px; border-bottom: 0; background: transparent; z-index: 2; }
    .convo-back { border: 0; background: none; color: #000; cursor: pointer; display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; }
    .convo-back svg { width: 24px; height: 24px; }
    .convo-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; flex: 0 0 auto; }
    .convo-title { min-width: 0; }
    .convo-name { font-size: 16px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-sub { font-size: 12px; color: var(--nc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-actions { margin-left: auto; display: flex; gap: 2px; flex: 0 0 auto; }
    .convo-actions button { border: 0; background: none; color: #000; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; }
    .convo-actions svg { width: 22px; height: 22px; }
    /* 訊息區（聊天背景套在這裡）*/
    .msgs { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 3px; background: transparent; }
    .msgs::-webkit-scrollbar { width: 0; }
    .bubble { max-width: 76%; padding: 8px 13px; border-radius: 20px; font-size: 16px; line-height: 1.35; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
    .bubble.them { align-self: flex-start; background: var(--nc-bubble-them); color: #000; border-bottom-left-radius: 6px; }
    .bubble.me { align-self: flex-end; background: var(--nc-bubble-me); color: #111; border-bottom-right-radius: 6px; }
    .bubble .who { font-size: 12px; font-weight: 600; color: var(--nc-blue); margin-bottom: 2px; }
    .bubble .mt { font-size: 10px; opacity: .6; margin-left: 8px; float: right; margin-top: 6px; }
    .bubble.me .mt { color: #000; }
    /* 半透明毛玻璃：讓聊天背景透到底部、真正全螢幕 */
    /* 底部透明：照片透到最下（無白底、無分隔線）*/
    /* 鍵盤：只有訊息筐升起（margin-bottom = 鍵盤高度），背景容器 .convo 完全不縮 → 聊天背景相片不會變窄、不會閃 */
    /* 鍵盤：只有輸入框往上（transform 上移鍵盤高度），訊息列表與背景都不跟著動 */
    .composer { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 0; background: transparent; transform: translateY(calc(-1 * var(--kb, 0px))); transition: transform .2s ease-out; }
    .composer .plus { border: 0; background: none; color: #000; cursor: pointer; width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; }
    .composer .plus svg { width: 26px; height: 26px; }
    .composer .field { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--nc-fill-secondary); border-radius: 20px; padding: 7px 14px; }
    .composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; font-family: var(--sf); font-size: 16px; max-height: 90px; line-height: 1.3; color: #000; }
    .composer .send { border: 0; background: var(--nc-blue); color: #fff; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; transition: transform .1s, opacity .15s; }
    .composer .send:disabled { opacity: .35; }
    .composer .send svg { width: 20px; height: 20px; }

    /* 聊天背景選擇器（底部彈出）*/
    .bgsheet { position: absolute; inset: 0; z-index: 30; display: none; }
    .bgsheet.open { display: block; }
    .bgsheet .mask { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; }
    .bgsheet.open .mask { opacity: 1; }
    .bgsheet .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .bgsheet.open .panel { transform: translateY(0); }
    .bgsheet .ph { display: flex; align-items: center; margin-bottom: 14px; }
    .bgsheet .ph b { font-size: 17px; }
    .bgsheet .ph button { margin-left: auto; border: 0; background: none; color: var(--nc-blue); font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--sf); }
    .bggrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .bgopt { aspect-ratio: 9/16; border-radius: 12px; border: 2.5px solid transparent; cursor: pointer; background-size: cover; background-position: center; }
    .bgopt.sel { border-color: var(--nc-blue); }
    .bgopt.upload { display: grid; place-items: center; background: var(--nc-fill-secondary); color: var(--nc-label-secondary); }
    .bgopt.upload svg { width: 24px; height: 24px; }

    .toast { position: absolute; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 40; background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 100px; font-size: 13px; transition: opacity .2s, transform .2s; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <main class="app" id="app" role="application" aria-label="NovaCHAT 聊天">

    <div class="topbar">
      <div class="search" role="search">

      if(!lensMotion.frame){ lensMotion.last=performance.now(); lensMotion.frame=requestAnimationFrame(stepLens); } }
    function sizeLens(){ const bw=tabbar.getBoundingClientRect().width||window.innerWidth; LENS_W=Math.round((bw-TAB_PAD*2)/tabs().length+16); document.documentElement.style.setProperty('--lens-w', LENS_W+'px'); }
    sizeLens(); window.addEventListener('resize', sizeLens); ensureLensGlass();

    let dragStartX=null, draggingNow=false, lensTimer=0, lensDoneTimer=0;
    function showLens(clientX){ clearTimeout(lensTimer); clearTimeout(lensDoneTimer); ensureLensGlass();
      lensBar=tabbar.getBoundingClientRect(); sizeLens(); buildLensSprite();
      lensToX(tabCenter(tabAt(clientX)), true);
      tabbar.classList.add('is-dragging'); tabLens.classList.add('is-on'); startHole();
      requestAnimationFrame(()=>lensGlass&&lensGlass.flush&&lensGlass.flush());
      [90,250].forEach(ms=>setTimeout(()=>lensGlass&&lensGlass.flush&&lensGlass.flush(), ms)); }
    function hideLens(delay){ clearTimeout(lensTimer); clearTimeout(lensDoneTimer);
      lensTimer=setTimeout(()=>{ tabLens.classList.remove('is-on');
        lensDoneTimer=setTimeout(()=>{ if(tabLens.classList.contains('is-on')) return; tabbar.classList.remove('is-dragging'); }, 340); }, delay); }
    tabbar.addEventListener('pointerdown',(e)=>{ if(!e.target.closest('.tab')) return; dragStartX=e.clientX; draggingNow=false; try{ tabbar.setPointerCapture(e.pointerId); }catch{} showLens(e.clientX); });
    tabbar.addEventListener('pointermove',(e)=>{ if(dragStartX===null) return; if(!draggingNow && Math.abs(e.clientX-dragStartX)<6) return; draggingNow=true; lensToX(e.clientX); });
    function endDrag(e){ if(dragStartX===null) return; const t=tabAt(e.clientX); dragStartX=null; draggingNow=false; lensToX(tabCenter(t)); selectTab(t,false); hideLens(260); }
    tabbar.addEventListener('pointerup',endDrag);
    tabbar.addEventListener('pointercancel',()=>{ dragStartX=null; draggingNow=false; hideLens(0); selectTab(document.querySelector('.tab.active')||tabs()[0], true); });
    tabbar.addEventListener('lostpointercapture',()=>{ if(dragStartX===null) return; dragStartX=null; draggingNow=false; hideLens(0); });
    tabbar.addEventListener('click',(e)=>{ e.preventDefault(); if(e.detail===0){ const t=e.target.closest('.tab'); if(t) selectTab(t,false); } });
    const relocate=()=>placePill(document.querySelector('.tab.active')||tabs()[0], true);
    requestAnimationFrame(relocate); window.addEventListener('resize',relocate);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(relocate);
  }
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }

  // 阻擋 iOS Safari 的雙指/雙擊放大（user-scalable=no 在 Safari 不完全生效）
  document.addEventListener('gesturestart', (e)=>e.preventDefault());
  let lastTouch=0;
  document.addEventListener('touchend',(e)=>{ const now=Date.now(); if(now-lastTouch<=300) e.preventDefault(); lastTouch=now; }, {passive:false});

  /* ===== 手機鍵盤：只讓底部訊息筐升起，背景不縮、不閃 =====
     只用 VisualViewport 量出鍵盤高度寫進 --kb；由 .composer 的 margin-bottom 吃掉 → 訊息列表縮短、
     訊息筐升到鍵盤上方。背景容器 .convo 高度完全不變，所以聊天背景相片不會被重新裁切（不變窄），
     也沒有改高度 / transform / setTimeout 補畫，所以不會閃。 */
  (function keyboardFix(){
    const vv = window.visualViewport;
    if(!vv) return;                      // 舊瀏覽器：--kb 維持 0，行為同原本
    const root = document.documentElement;
    let raf = 0;
    function apply(){
      raf = 0;
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height));   // 鍵盤高度
      root.style.setProperty('--kb', kb + 'px');
      if(kb > 0 && window.scrollY) window.scrollTo(0, 0);         // 防止 iOS 把整頁上捲（只有輸入框動，其他不動）
    }
    const schedule = ()=>{ if(!raf) raf = requestAnimationFrame(apply); };
    vv.addEventListener('resize', schedule);
    vv.addEventListener('scroll', schedule);
  })();

  (async function init(){ bind(); applyBg(getBg()); await Store.fetchChats(); renderList();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); })();
  </script>
</body>
