<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- 全螢幕 + 鎖定縮放（照 Group.html）：畫到整個螢幕、禁止雙指/雙擊放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 狀態列透明、畫面延伸到狀態列/瀏海底下（照 Group 做法）；內容用 env(safe-area-inset-*) 讓開 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaCHAT">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>NovaCHAT</title>
  <style>
    :root {
      --nc-blue: #007aff;
      --nc-fill-secondary: rgba(120,120,128,0.16);
      --nc-label-secondary: #727272;
      --nc-bar-fill: rgba(249,249,249,0.94);
      --nc-bar-active: rgba(120,120,128,0.14);
      --nc-text: #000;
      --nc-text-2: #8a8a8e;
      --nc-sep: rgba(60,60,67,0.12);
      --nc-chip: rgba(120,120,128,0.12);
      --nc-badge: #ff3b30;
      --nc-online: #34c759;
      --nc-bubble-me: #007aff;
      --nc-bubble-them: #e9e9eb;
      --sf: -apple-system, "SF Pro Text", "SF Pro", system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --inter: "Inter", -apple-system, system-ui, "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    /* 鎖定：全螢幕、不捲動頁面、不放大、不橡皮筋、不選取/長按選單 */
    html { height: 100%; overflow: hidden; }
    body {
      position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden;
      background: #fff; font-family: var(--sf); display: flex; justify-content: center;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    input, textarea { -webkit-user-select: text; user-select: text; }

    .app {
      position: relative; width: 100%; height: 100%;   /* 填滿固定的 body，不用 dvh/vh 避免底部露出一塊 */
      background: #fff; overflow: hidden; display: flex; flex-direction: column;
    }

    /* 頂部 */
    .topbar { flex: 0 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; }
    .search { width: 100%; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 11px; background: var(--nc-fill-secondary); border-radius: 100px; }
    .search .mag { width: 21px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mag svg { width: 16px; height: 16px; }
    .search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--sf); font-size: 17px; line-height: 22px; letter-spacing: -0.08px; color: #000; }
    .search input::placeholder { color: var(--nc-label-secondary); opacity: 1; }
    .search .mic { width: 17px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mic svg { width: 15px; height: 20px; }
    .chat-label { margin: 16px 0 0 2px; font-family: var(--inter); font-weight: 400; font-size: 12px; color: #000; white-space: nowrap; }
    .chips { display: flex; gap: 8px; margin-top: 12px; }
    .chip { border: 0; cursor: pointer; font-family: var(--sf); font-size: 14px; font-weight: 600; background: var(--nc-chip); color: #3c3c43; padding: 7px 15px; border-radius: 100px; display: inline-flex; align-items: center; gap: 6px; }
    .chip.active { background: var(--nc-blue); color: #fff; }
    .chip .cnt { background: var(--nc-badge); color: #fff; font-size: 11px; font-weight: 700; border-radius: 100px; padding: 0 6px; min-width: 18px; text-align: center; }
    .chip.active .cnt { background: rgba(255,255,255,.3); }

    /* 列表 */
    .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding-top: 6px; }
    .list::-webkit-scrollbar { width: 0; }
    .crow { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; position: relative; }
    .crow:active { background: rgba(0,0,0,0.04); }
    .crow + .crow::before { content: ""; position: absolute; left: 80px; right: 0; top: 0; height: 1px; background: var(--nc-sep); }
    .av { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 19px; position: relative; }
    .av .dot { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--nc-online); border: 2.5px solid #fff; }
    .av .gb { position: absolute; right: -2px; bottom: -2px; width: 19px; height: 19px; border-radius: 50%; background: #eee; color: #8a8a8e; display: grid; place-items: center; border: 2px solid #fff; }
    .av .gb svg { width: 11px; height: 11px; }
    .cmain { flex: 1; min-width: 0; }
    .ctop { display: flex; align-items: baseline; gap: 8px; }
    .cname { font-size: 16px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctime { margin-left: auto; font-size: 13px; color: var(--nc-text-2); flex: 0 0 auto; }
    .crow.unread .ctime { color: var(--nc-blue); }
    .cbot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .cprev { font-size: 14px; color: var(--nc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; line-height: 1.3; }
    .crow.unread .cprev { color: #000; }
    .cprev .by { color: var(--nc-text-2); }
    .ticks { color: var(--nc-text-2); flex: 0 0 auto; display: inline-flex; }
    .ticks.read { color: var(--nc-blue); }
    .ticks svg { width: 16px; height: 16px; }
    .cbadge { flex: 0 0 auto; background: var(--nc-badge); color: #fff; font-size: 12px; font-weight: 700; border-radius: 100px; min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; }
    .cmute { color: var(--nc-text-2); flex: 0 0 auto; display: inline-flex; }
    .cmute svg { width: 16px; height: 16px; }
    .empty { display: none; text-align: center; color: var(--nc-text-2); padding: 64px 32px; }
    .empty svg { width: 46px; height: 46px; opacity: .4; margin-bottom: 12px; }
    .empty h3 { font-size: 16px; color: #3c3c43; margin-bottom: 4px; font-weight: 600; }
    .empty p { font-size: 14px; }

    /* Tab Bar — iOS 底部不過高：用 max() 不疊加 safe-area */
    .tabbar { flex: 0 0 auto; display: flex; justify-content: center; padding: 8px 16px max(8px, env(safe-area-inset-bottom, 0px)); }
    .tabbar-inner { width: 100%; height: 62px; background: var(--nc-bar-fill); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border: 0.5px solid rgba(0,0,0,0.08); border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.10); display: flex; align-items: center; padding: 0 4px; position: relative; touch-action: none; }
    .tab-lens { position: absolute; top: 5px; height: 52px; left: 0; width: 0; background: var(--nc-bar-active); border-radius: 999px; z-index: 0; pointer-events: none; transition: left .3s cubic-bezier(.34,1.2,.5,1), width .3s cubic-bezier(.34,1.2,.5,1); }
    .tab { flex: 1; z-index: 1; height: 52px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; color: #000; font-family: var(--sf); position: relative; }
    .tab .ico { width: 26px; height: 26px; display: grid; place-items: center; }
    .tab .ico svg { width: 24px; height: 24px; fill: currentColor; }
    .tab .lbl { font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; }
    .tab.active { color: var(--nc-blue); }

    /* 對話頁 */
    .convo { position: absolute; inset: 0; z-index: 20; background: #fff; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); visibility: hidden; }
    .convo.open { transform: translateX(0); visibility: visible; }
    .convo-header { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 10px; border-bottom: 0.5px solid var(--nc-sep); background: rgba(255,255,255,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 2; }
    .convo-back { border: 0; background: none; color: var(--nc-blue); cursor: pointer; display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; }
    .convo-back svg { width: 24px; height: 24px; }
    .convo-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; flex: 0 0 auto; }
    .convo-title { min-width: 0; }
    .convo-name { font-size: 16px; font-weight: 600; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-sub { font-size: 12px; color: var(--nc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-actions { margin-left: auto; display: flex; gap: 2px; flex: 0 0 auto; }
    .convo-actions button { border: 0; background: none; color: var(--nc-blue); cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; }
    .convo-actions svg { width: 22px; height: 22px; }
    /* 訊息區（聊天背景套在這裡）*/
    .msgs { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 3px; background: #fff; background-size: cover; background-position: center; }
    .msgs::-webkit-scrollbar { width: 0; }
    .bubble { max-width: 76%; padding: 8px 13px; border-radius: 20px; font-size: 16px; line-height: 1.35; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
    .bubble.them { align-self: flex-start; background: var(--nc-bubble-them); color: #000; border-bottom-left-radius: 6px; }
    .bubble.me { align-self: flex-end; background: var(--nc-bubble-me); color: #fff; border-bottom-right-radius: 6px; }
    .bubble .who { font-size: 12px; font-weight: 600; color: var(--nc-blue); margin-bottom: 2px; }
    .bubble .mt { font-size: 10px; opacity: .6; margin-left: 8px; float: right; margin-top: 6px; }
    .bubble.me .mt { color: #fff; }
    .composer { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 0.5px solid var(--nc-sep); background: #fff; }
    .composer .plus { border: 0; background: none; color: var(--nc-blue); cursor: pointer; width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; }
    .composer .plus svg { width: 26px; height: 26px; }
    .composer .field { flex: 1; min-width: 0; display: flex; align-items: center; background: var(--nc-fill-secondary); border-radius: 20px; padding: 7px 14px; }
    .composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; font-family: var(--sf); font-size: 16px; max-height: 90px; line-height: 1.3; color: #000; }
    .composer .send { border: 0; background: var(--nc-blue); color: #fff; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; transition: transform .1s, opacity .15s; }
    .composer .send:disabled { opacity: .35; }
    .composer .send svg { width: 20px; height: 20px; }

    /* 聊天背景選擇器（底部彈出）*/
    .bgsheet { position: absolute; inset: 0; z-index: 30; display: none; }
    .bgsheet.open { display: block; }
    .bgsheet .mask { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; }
    .bgsheet.open .mask { opacity: 1; }
    .bgsheet .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .bgsheet.open .panel { transform: translateY(0); }
    .bgsheet .ph { display: flex; align-items: center; margin-bottom: 14px; }
    .bgsheet .ph b { font-size: 17px; }
    .bgsheet .ph button { margin-left: auto; border: 0; background: none; color: var(--nc-blue); font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--sf); }
    .bggrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .bgopt { aspect-ratio: 9/16; border-radius: 12px; border: 2.5px solid transparent; cursor: pointer; background-size: cover; background-position: center; }
    .bgopt.sel { border-color: var(--nc-blue); }
    .bgopt.upload { display: grid; place-items: center; background: var(--nc-fill-secondary); color: var(--nc-label-secondary); }
    .bgopt.upload svg { width: 24px; height: 24px; }

    .toast { position: absolute; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 40; background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 100px; font-size: 13px; transition: opacity .2s, transform .2s; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <main class="app" id="app" role="application" aria-label="NovaCHAT 聊天">

    <div class="topbar">
      <div class="search" role="search">
        <span class="mag" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input id="searchInput" type="search" placeholder="搜尋" aria-label="搜尋" autocomplete="off">
        <span class="mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      </div>
      <div class="chat-label">聊天</div>
      <nav class="chips" id="chips" aria-label="聊天分類">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="unread">未讀 <span class="cnt" id="unreadCnt">0</span></button>
        <button class="chip" data-filter="group">群組</button>
      </nav>
    </div>

    <section class="list" id="list" aria-label="聊天列表"></section>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3 id="emptyTitle">沒有聊天</h3>
      <p id="emptyDesc">開始一段新的對話吧</p>
    </div>

    <nav class="tabbar" aria-label="主導覽">
      <div class="tabbar-inner" id="tabbar">
        <span class="tab-lens" id="tabLens" aria-hidden="true"></span>
        <button class="tab" data-tab="home"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2.5l9.5 9.5L12 21.5 2.5 12 12 2.5z"/></svg></span><span class="lbl">主頁</span></button>
        <button class="tab active" data-tab="chat" aria-current="page"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/></svg></span><span class="lbl">聊天</span></button>
        <button class="tab" data-tab="video"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 16.5H2.5L12 3z"/></svg></span><span class="lbl">VIDEO</span></button>
        <button class="tab" data-tab="seal"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2c1 0 1.9.6 2.3 1.5.9-.5 2-.4 2.8.3.8.7 1 1.8.6 2.7.9.3 1.5 1.2 1.5 2.2s-.6 1.9-1.5 2.2c.4.9.2 2-.6 2.7-.8.7-1.9.8-2.8.3-.4.9-1.3 1.5-2.3 1.5s-1.9-.6-2.3-1.5c-.9.5-2 .4-2.8-.3-.8-.7-1-1.8-.6-2.7C3.6 13.9 3 13 3 12s.6-1.9 1.5-2.2c-.4-.9-.2-2 .6-2.7.8-.7 1.9-.8 2.8-.3C10.1 2.6 11 2 12 2z"/></svg></span><span class="lbl">❌</span></button>
        <button class="tab" data-tab="me"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg></span><span class="lbl">我的</span></button>
      </div>
    </nav>

    <section class="convo" id="convo" aria-label="對話" aria-hidden="true">
      <header class="convo-header">
        <button class="convo-back" id="convoBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="convo-av" id="convoAv"></span>
        <span class="convo-title"><span class="convo-name" id="convoName"></span><span class="convo-sub" id="convoSub"></span></span>
        <span class="convo-actions">
          <button aria-label="聊天背景" data-act="bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>
          <button aria-label="語音通話" data-act="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
          <button aria-label="視訊通話" data-act="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
        </span>
      </header>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="composer">
        <button type="button" class="plus" aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="field"><textarea id="msgInput" rows="1" placeholder="訊息" aria-label="輸入訊息"></textarea></div>
        <button type="submit" class="send" id="sendBtn" aria-label="傳送" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-8.4a.6.6 0 0 0 0-1.1L3.4 2.6a.6.6 0 0 0-.9.7L4.7 10l9.3 2-9.3 2-2.2 6.7a.6.6 0 0 0 .9.7z"/></svg></button>
      </form>
    </section>

    <!-- 聊天背景選擇器 -->
    <div class="bgsheet" id="bgsheet" aria-hidden="true">
      <div class="mask" id="bgmask"></div>
      <div class="panel">
        <div class="ph"><b>聊天背景</b><button id="bgdone">完成</button></div>
        <div class="bggrid" id="bggrid"></div>
      </div>
    </div>
    <input id="bgfile" type="file" accept="image/*" hidden>

    <div class="toast" id="toast"></div>
  </main>

  <script>
  /* 資料層 Store（本地範例；之後換 fetch('/api/...')）*/
  const SEED = { me:'me', chats:[
    { id:'c1', type:'dm', name:'林子晴', color:'#ff7a59', online:true, muted:false, time:'剛剛', unread:2,
      msgs:[ {from:'林子晴',text:'在嗎？週末有空嗎',t:'14:02'},{from:'林子晴',text:'那我們約週六下午見！',t:'14:05'} ] },
    { id:'g1', type:'group', name:'設計小組', color:'#5b6cff', members:6, muted:false, time:'09:12', unread:5,
      msgs:[ {from:'阿哲',text:'新版 Logo 已上傳',t:'09:10'},{from:'阿哲',text:'大家看看配色',t:'09:12'} ] },
    { id:'c2', type:'dm', name:'Kevin', color:'#37b6d6', online:false, muted:false, time:'08:40', unread:0,
      msgs:[ {from:'me',text:'檔案收到了嗎？',t:'08:38',status:'read'},{from:'Kevin',text:'收到，謝謝！',t:'08:39'},{from:'me',text:'👍',t:'08:40',status:'read'} ] },
    { id:'g2', type:'group', name:'家庭群組', color:'#34c759', members:4, muted:true, time:'昨天', unread:0,
      msgs:[ {from:'媽',text:'晚餐吃火鍋喔',t:'昨天 18:20'} ] },
    { id:'c3', type:'dm', name:'陳柏宇', color:'#a06bff', online:true, muted:false, time:'昨天', unread:0,
      msgs:[ {from:'me',text:'你傳的檔案我下載好了',t:'昨天 21:11',status:'delivered'} ] },
    { id:'c4', type:'dm', name:'Amy', color:'#ff2d87', online:false, muted:false, time:'週一', unread:0,
      msgs:[ {from:'Amy',text:'哈哈哈哈太好笑了',t:'週一 12:30'} ] },
    { id:'g3', type:'group', name:'週末登山團', color:'#ff9f0a', members:12, muted:false, time:'週一', unread:1,
      msgs:[ {from:'隊長',text:'天氣預報下雨，改期？',t:'週一 20:01'} ] },
    { id:'c5', type:'dm', name:'王美玲', color:'#8e8e93', online:false, muted:false, time:'11/3', unread:0,
      msgs:[ {from:'me',text:'好的沒問題',t:'11/3',status:'read'} ] },
  ] };
  const Store = {
    _c: [],
    async fetchChats(){ this._c = SEED.chats.map(c => ({...c, msgs:[...c.msgs]})); return this._c; },
    all(){ return this._c; },
    get(id){ return this._c.find(c => c.id === id); },
    unreadTotal(){ return this._c.reduce((n,c)=>n+(c.unread||0),0); },
    send(id, text){ const c=this.get(id); if(!c) return;
      const t=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
      c.msgs.push({ from:'me', text, t, status:'delivered' }); c.time=t; c.unread=0; },
    markRead(id){ const c=this.get(id); if(c) c.unread=0; },
  };

  const State = { filter:'all', query:'', openId:null };
  const $ = (s)=>document.querySelector(s);
  const esc = (s)=>String(s).replace(/[&<>"]/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const initials = (n)=>{ n=n.trim(); return /[一-鿿]/.test(n)?n.slice(-2):n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); };
  const ICON = {
    tick1:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
    tick2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l5 5 9-11"/><path d="M11 17l1.4-1.7M22 6l-6 7.3"/></svg>',
    group:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h7v-2.5c0-.9.4-1.6 1-2.3A9 9 0 0 0 8 13zm8 0c-.3 0-.6 0-1 .1 1.3 1 2 1.8 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>',
    mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>',
  };

  function match(c){
    if(State.filter==='unread' && !(c.unread>0)) return false;
    if(State.filter==='group' && c.type!=='group') return false;
    const q=State.query.trim().toLowerCase();
    if(q){ const last=c.msgs[c.msgs.length-1]; const hay=(c.name+' '+(last?last.text:'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }
  function rowHTML(c){
    const last=c.msgs[c.msgs.length-1]; const unread=c.unread>0; let prev='';
    if(last){
      if(last.from==='me'){
        const tk=last.status==='read'?`<span class="ticks read">${ICON.tick2}</span>`:`<span class="ticks">${ICON.tick1}</span>`;
        prev=`${tk}<span class="cprev"><span class="by">你：</span>${esc(last.text)}</span>`;
      } else { const by=c.type==='group'?`<span class="by">${esc(last.from)}：</span>`:''; prev=`<span class="cprev">${by}${esc(last.text)}</span>`; }
    }
    const right=unread?`<span class="cbadge">${c.unread>99?'99+':c.unread}</span>`:(c.muted?`<span class="cmute">${ICON.mute}</span>`:'');
    const extra=c.type==='group'?`<span class="gb">${ICON.group}</span>`:(c.online?'<span class="dot"></span>':'');
    return `<div class="crow ${unread?'unread':''}" data-id="${c.id}" role="button" tabindex="0">
      <span class="av" style="background:${c.color}">${esc(initials(c.name))}${extra}</span>
      <span class="cmain"><span class="ctop"><span class="cname">${esc(c.name)}</span><span class="ctime">${esc(c.time)}</span></span>
      <span class="cbot">${prev}${right}</span></span></div>`;
  }
  function renderList(){
    const rows=Store.all().filter(match);
    $('#list').innerHTML=rows.map(rowHTML).join('');
    const empty=rows.length===0;
    $('#empty').style.display=empty?'block':'none'; $('#list').style.display=empty?'none':'block';
    if(empty){ const s=State.query.trim();
      $('#emptyTitle').textContent=s?'找不到結果':'沒有聊天';
      $('#emptyDesc').textContent=s?`沒有符合「${s}」的好友、群組或訊息`:(State.filter==='unread'?'目前沒有未讀訊息':'開始一段新的對話吧'); }
    const n=Store.unreadTotal(); $('#unreadCnt').textContent=n; $('#unreadCnt').style.display=n?'inline-block':'none';
  }

  function msgHTML(m, c){
    const mine=m.from==='me';
    const who=(!mine && c.type==='group')?`<span class="who">${esc(m.from)}</span>`:'';
    const tk=mine?(m.status==='read'?`<span style="margin-left:4px">${ICON.tick2}</span>`:`<span style="margin-left:4px">${ICON.tick1}</span>`):'';
    return `<div class="bubble ${mine?'me':'them'}">${who}${esc(m.text)}<span class="mt">${esc(m.t)}${mine?tk:''}</span></div>`;
  }
  function openConvo(id){
    const c=Store.get(id); if(!c) return;
    State.openId=id; Store.markRead(id);
    $('#convoAv').textContent=initials(c.name); $('#convoAv').style.background=c.color;
    $('#convoName').textContent=c.name;
    $('#convoSub').textContent=c.type==='group'?`${c.members} 位成員`:(c.online?'線上':'離線');
    $('#msgs').innerHTML=c.msgs.map(m=>msgHTML(m,c)).join('');
    const co=$('#convo'); co.classList.add('open'); co.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>{ $('#msgs').scrollTop=$('#msgs').scrollHeight; });
  }
  function closeConvo(){ const co=$('#convo'); co.classList.remove('open'); co.setAttribute('aria-hidden','true'); State.openId=null; renderList(); }

  /* ---- 聊天背景 ---- */
  const BG_PRESETS = [
    { id:'default', css:'#ffffff' },
    { id:'paper',   css:'#f3efe7' },
    { id:'warm',    css:'linear-gradient(160deg,#ffe3d3,#ffd0e0)' },
    { id:'cool',    css:'linear-gradient(160deg,#d6ecff,#e7d6ff)' },
    { id:'mint',    css:'linear-gradient(160deg,#d6fff0,#d6f0ff)' },
    { id:'sky',     css:'linear-gradient(160deg,#a1c4fd,#c2e9fb)' },
    { id:'dusk',    css:'linear-gradient(160deg,#2b2d42,#4a4e69)' },
  ];
  function getBg(){ try{ return JSON.parse(localStorage.getItem('nc.chatbg')||'null'); }catch{ return null; } }
  function applyBg(bg){
    const m=$('#msgs');
    if(!bg || (bg.type==='preset' && bg.value==='#ffffff')){ m.style.backgroundImage='none'; m.style.background='#fff'; return; }
    if(bg.type==='photo'){ m.style.background='#000'; m.style.backgroundImage=`url("${bg.value}")`; }
    else { m.style.backgroundImage='none'; m.style.background=bg.value; }
  }
  function saveBg(bg){ try{ localStorage.setItem('nc.chatbg', JSON.stringify(bg)); }catch(e){ toast('照片太大無法儲存'); } applyBg(bg); }
  function renderBgGrid(){
    const cur=getBg(); const grid=$('#bggrid');
    let html = BG_PRESETS.map(p=>{
      const sel = cur ? (cur.type==='preset' && cur.value===p.css) : (p.id==='default');
      return `<button class="bgopt ${sel?'sel':''}" data-css="${p.css}" style="background:${p.css}"></button>`;
    }).join('');
    if(cur && cur.type==='photo') html += `<button class="bgopt sel" data-photo="1" style="background-image:url('${cur.value}')"></button>`;
    html += `<button class="bgopt upload" id="bgupload" aria-label="用自己的照片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>`;
    grid.innerHTML=html;
  }
  function openBgSheet(){ renderBgGrid(); const s=$('#bgsheet'); s.classList.add('open'); s.setAttribute('aria-hidden','false'); }
  function closeBgSheet(){ const s=$('#bgsheet'); s.classList.remove('open'); s.setAttribute('aria-hidden','true'); }
  function downscale(dataUrl, cb){
    const img=new Image();
    img.onload=()=>{ const max=1280; let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h));
      const cw=Math.round(w*s), ch=Math.round(h*s); const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch); try{ cb(cv.toDataURL('image/jpeg',0.82)); }catch{ cb(dataUrl); } };
    img.onerror=()=>cb(dataUrl); img.src=dataUrl;
  }

  function bind(){
    const inp=$('#searchInput');
    inp.addEventListener('input',()=>{ State.query=inp.value; renderList(); });
    $('#chips').addEventListener('click',(e)=>{ const ch=e.target.closest('.chip'); if(!ch) return; State.filter=ch.dataset.filter; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===ch)); renderList(); });
    $('#list').addEventListener('click',(e)=>{ const r=e.target.closest('.crow'); if(!r) return; openConvo(r.dataset.id); });
    $('#convoBack').addEventListener('click',closeConvo);
    document.querySelectorAll('.convo-actions button').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.act;
      if(a==='bg'){ openBgSheet(); return; }
      toast(a==='voice'?'語音通話（下一階段）':'視訊通話（下一階段）');
    }));

    // 背景選擇器事件
    $('#bggrid').addEventListener('click',(e)=>{ const o=e.target.closest('.bgopt'); if(!o) return;
      if(o.id==='bgupload' || o.closest('#bgupload')){ $('#bgfile').click(); return; }
      if(o.dataset.css){ saveBg({type:'preset', value:o.dataset.css}); renderBgGrid(); } });
    $('#bgfile').addEventListener('change',(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>downscale(r.result,(small)=>{ saveBg({type:'photo', value:small}); renderBgGrid(); }); r.readAsDataURL(f); e.target.value=''; });
    $('#bgmask').addEventListener('click',closeBgSheet);
    $('#bgdone').addEventListener('click',closeBgSheet);

    // 送訊息
    const ta=$('#msgInput'), send=$('#sendBtn');
    const refresh=()=>{ send.disabled=ta.value.trim()===''; ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,90)+'px'; };
    ta.addEventListener('input',refresh);
    ta.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#composer').requestSubmit(); } });
    $('#composer').addEventListener('submit',(e)=>{
      e.preventDefault(); const text=ta.value.trim(); if(!text||!State.openId) return;
      const c=Store.get(State.openId); Store.send(State.openId,text);
      $('#msgs').insertAdjacentHTML('beforeend',msgHTML(c.msgs[c.msgs.length-1],c));
      ta.value=''; refresh(); $('#msgs').scrollTop=$('#msgs').scrollHeight;
    });
    $('.composer .plus').addEventListener('click',()=>toast('附件 / 圖片（下一階段）'));

    // Tab Bar：膠囊可點、可左右拖動
    const tabbar=$('#tabbar'), lens=$('#tabLens');
    const tabs=()=>[...tabbar.querySelectorAll('.tab')];
    const moveLens=(t)=>{ if(!t) return; lens.style.transition=''; lens.style.left=t.offsetLeft+'px'; lens.style.width=t.offsetWidth+'px'; };
    function selectTab(t, silent){ if(!t) return;
      tabs().forEach(x=>{ const on=x===t; x.classList.toggle('active',on); on?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'); });
      moveLens(t); if(!silent && t.dataset.tab!=='chat') toast(t.querySelector('.lbl').textContent+'（下一階段）'); }
    const tabAtX=(clientX)=>{ const r=tabbar.getBoundingClientRect(); const x=clientX-r.left;
      let best=tabs()[0], bd=Infinity; tabs().forEach(t=>{ const c=t.offsetLeft+t.offsetWidth/2; const d=Math.abs(c-x); if(d<bd){bd=d;best=t;} }); return best; };
    let dragging=false, moved=false;
    tabbar.addEventListener('pointerdown',(e)=>{ if(!e.target.closest('.tab')) return; dragging=true; moved=false; try{ tabbar.setPointerCapture(e.pointerId); }catch{} });
    tabbar.addEventListener('pointermove',(e)=>{ if(!dragging) return; moved=true;
      const r=tabbar.getBoundingClientRect(); const w=lens.offsetWidth||tabs()[0].offsetWidth;
      let left=e.clientX-r.left-w/2; left=Math.max(4, Math.min(left, tabbar.clientWidth-w-4));
      lens.style.transition='none'; lens.style.left=left+'px'; });
    const endDrag=(e)=>{ if(!dragging) return; dragging=false; selectTab(tabAtX(e.clientX), false); };
    tabbar.addEventListener('pointerup',endDrag);
    tabbar.addEventListener('pointercancel',()=>{ dragging=false; selectTab(document.querySelector('.tab.active'), true); });
    tabbar.addEventListener('click',(e)=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; return; } const t=e.target.closest('.tab'); if(t) selectTab(t,false); });
    const relocate=()=>moveLens(document.querySelector('.tab.active'));
    requestAnimationFrame(relocate); window.addEventListener('resize',relocate);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(relocate);
  }
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }

  // 阻擋 iOS Safari 的雙指/雙擊放大（user-scalable=no 在 Safari 不完全生效）
  document.addEventListener('gesturestart', (e)=>e.preventDefault());
  let lastTouch=0;
  document.addEventListener('touchend',(e)=>{ const now=Date.now(); if(now-lastTouch<=300) e.preventDefault(); lastTouch=now; }, {passive:false});

  (async function init(){ bind(); applyBg(getBg()); await Store.fetchChats(); renderList();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); })();
  </script>
</body>
</html>
