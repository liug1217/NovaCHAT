<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NovaCHAT">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>NovaCHAT</title>
  <style>
    /* ================================================================
       NovaCHAT 聊天頁 — 依 Figma「iPhone 18 Pro Max - 1」(440×956) 1:1 還原
       取自 Figma 的精確值：
       - 搜尋欄 fill rgba(120,120,128,0.16) / radius 100 / h35 / SF Pro 17 #727272
       - 「聊天」Inter 12 #000 於 (62,149)
       - Tab Bar iOS 27：5 格（diamond.fill/circle.fill/triangle.fill/seal.fill/square.fill）
         標籤 Tab 1 / 聊天 / VIDEO / ❌ / 我的；Tab 1 選中（藍）
       ================================================================ */
    :root {
      --nc-blue: #007aff;                         /* iOS 選中色 */
      --nc-fill-secondary: rgba(120,120,128,0.16);/* 搜尋欄底 */
      --nc-label-secondary: #727272;              /* 搜尋 placeholder / 圖示 */
      --nc-bar-fill: rgba(249,249,249,0.94);      /* tab bar 底（淺）*/
      --nc-bar-active: rgba(120,120,128,0.14);    /* 選中格的高亮底 */
      --sf: -apple-system, "SF Pro Text", "SF Pro", system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --inter: "Inter", -apple-system, system-ui, "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #c9ccd2;                 /* 畫布外的中性底（桌面時可見）*/
      font-family: var(--sf);
      display: flex; justify-content: center; align-items: flex-start;
      overflow: hidden;
    }
    /* 置中縮放用的舞台 */
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    /* Figma 畫板：440×956，整體等比縮放至視窗 */
    .artboard {
      position: relative;
      width: 440px; height: 956px;
      background: #ffffff;
      overflow: hidden;
      transform-origin: center center;
      flex: 0 0 auto;
    }

    /* ---- 搜尋欄（Figma: x10 y70 w420 h35）---- */
    .search {
      position: absolute; left: 10px; top: 70px; width: 420px; height: 35px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 11px;
      background: var(--nc-fill-secondary);
      border-radius: 100px;
    }
    .search .mag { width: 21px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mag svg { width: 16px; height: 16px; }
    .search input {
      flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
      font-family: var(--sf); font-size: 17px; line-height: 22px; letter-spacing: -0.08px;
      color: #000;
    }
    .search input::placeholder { color: var(--nc-label-secondary); opacity: 1; }
    .search .mic { width: 17px; height: 22px; flex: 0 0 auto; color: var(--nc-label-secondary); display: grid; place-items: center; }
    .search .mic svg { width: 15px; height: 20px; }

    /* ---- 「聊天」標題（Figma: x62 y149, Inter 12 #000）---- */
    .chat-label {
      position: absolute; left: 62px; top: 149px;
      font-family: var(--inter); font-weight: 400; font-size: 12px; line-height: normal;
      color: #000; white-space: nowrap;
    }

    /* ---- 聊天列表容器（Figma 內容為空；保留滾動區，之後接資料）---- */
    .list { position: absolute; left: 0; right: 0; top: 172px; bottom: 95px; overflow-y: auto; }
    .list::-webkit-scrollbar { width: 0; }

    /* ---- Tab Bar（Figma: x0 y861 w440 h95，iOS 27 浮動列）---- */
    .tabbar {
      position: absolute; left: 0; top: 861px; width: 440px; height: 95px;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 12px 0 0;                 /* Figma: 浮動列距區塊頂 12px（y=873）*/
    }
    .tabbar-inner {
      width: 398px; height: 62px;        /* Figma: BG 398×62（兩側各留 21px）*/
      background: var(--nc-bar-fill);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 0.5px solid rgba(0,0,0,0.08);
      border-radius: 31px;               /* Figma: 高 62 的 pill */
      box-shadow: 0 6px 20px rgba(0,0,0,0.10);
      display: flex; align-items: center;
      padding: 0 4px;                    /* 內部按鈕區 390 寬 */
    }
    .tab {
      flex: 1; height: 52px; border: 0; background: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      border-radius: 22px; color: #000; font-family: var(--sf);
      position: relative;
    }
    .tab .ico { width: 26px; height: 26px; display: grid; place-items: center; }
    .tab .ico svg { width: 24px; height: 24px; fill: currentColor; }
    .tab .lbl { font-size: 10px; line-height: 1; font-weight: 500; white-space: nowrap; }
    .tab.active { background: var(--nc-bar-active); color: var(--nc-blue); }

    /* 桌面：畫板加圓角外框更像裝置 */
    @media (min-width: 480px) and (min-height: 980px) {
      .artboard { border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.28); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <main class="artboard" id="artboard" role="application" aria-label="NovaCHAT 聊天">

      <!-- 搜尋欄 -->
      <div class="search" role="search">
        <span class="mag" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </span>
        <input id="searchInput" type="search" placeholder="搜尋" aria-label="搜尋" autocomplete="off">
        <span class="mic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>

      <!-- 「聊天」 -->
      <div class="chat-label">聊天</div>

      <!-- 聊天列表（Figma 目前為空）-->
      <div class="list" id="list" aria-label="聊天列表"></div>

      <!-- 底部 Tab Bar（iOS 27，5 格，依 Figma）-->
      <nav class="tabbar" aria-label="主導覽">
        <div class="tabbar-inner" id="tabbar">
          <button class="tab active" data-tab="t1" aria-current="page">
            <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2.5l9.5 9.5L12 21.5 2.5 12 12 2.5z"/></svg></span>
            <span class="lbl">Tab 1</span>
          </button>
          <button class="tab" data-tab="chat">
            <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/></svg></span>
            <span class="lbl">聊天</span>
          </button>
          <button class="tab" data-tab="video">
            <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 16.5H2.5L12 3z"/></svg></span>
            <span class="lbl">VIDEO</span>
          </button>
          <button class="tab" data-tab="seal">
            <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2c1 0 1.9.6 2.3 1.5.9-.5 2-.4 2.8.3.8.7 1 1.8.6 2.7.9.3 1.5 1.2 1.5 2.2s-.6 1.9-1.5 2.2c.4.9.2 2-.6 2.7-.8.7-1.9.8-2.8.3-.4.9-1.3 1.5-2.3 1.5s-1.9-.6-2.3-1.5c-.9.5-2 .4-2.8-.3-.8-.7-1-1.8-.6-2.7C3.6 13.9 3 13 3 12s.6-1.9 1.5-2.2c-.4-.9-.2-2 .6-2.7.8-.7 1.9-.8 2.8-.3C10.1 2.6 11 2 12 2z"/></svg></span>
            <span class="lbl">❌</span>
          </button>
          <button class="tab" data-tab="me">
            <span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg></span>
            <span class="lbl">我的</span>
          </button>
        </div>
      </nav>

    </main>
  </div>

  <script>
    // 等比縮放畫板，讓 440×956 完整顯示在任何螢幕（照 Figma 比例）
    function fit() {
      const pad = window.innerWidth < 480 ? 0 : 24;
      const s = Math.min((window.innerWidth - pad) / 440, (window.innerHeight - pad) / 956);
      document.getElementById('artboard').style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();

    // Tab 切換（視覺；頁面內容為後續階段，不放假頁面）
    document.getElementById('tabbar').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab'); if (!tab) return;
      document.querySelectorAll('.tab').forEach((t) => {
        const on = t === tab;
        t.classList.toggle('active', on);
        if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
      });
    });

    // Service worker（離線 / 可安裝）
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
